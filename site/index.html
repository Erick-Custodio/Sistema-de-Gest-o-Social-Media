<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avélis</title>
<link rel="icon" type="image/png" href="avelis-icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar de navegação + área de trabalho; portal do cliente em coluna única com abas */
:root{
  /* Tema único invertido: área de trabalho vinho escuro, menu e faixas em rosé claro */
  --bg:#2A0711; --surface:#3A0C1A; --ink:#FBEFF2; --muted:#D4AAB5; --line:#561A2E; --accent:#F2A7BA; --accent-ink:#3B0716; --soft:#4A1426;
  --rose:#E7A3B3; --gold:#D9AE5F;
  --side-bg:#F2A7BA; --side-ink:#3B0716; --side-muted:#5E1C2F; --side-hover:rgba(59,7,22,.08); --side-active:rgba(59,7,22,.14); --side-accent:#3B0716;
  --band-bg:linear-gradient(170deg,#FFF7F9 0%,#FBEAEF 60%,#F5DCE4 100%); --band-muted:#8A5D69;
  --s1:#B9A6AD; --s2:#E59AAE; --s3:#E0B468; --s4:#B39AF0; --s5:#EC77B0; --s6:#F7A1B8; --s7:#62D0A6; --grav:#B39AF0; --tsk:#E0B468; --ok:#62D0A6; --warn:#F59570;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  /* botões: rosa claro */
  --btn-bg:#FBDDE6; --btn-ink:#3B0716; --btn-line:#F5C3D1; --btn-hover:#FFE9EF;
  --btn-primary:#F2A7BA; --btn-primary-ink:#3B0716; --btn-ghost-ink:#F7BFCD; --btn-danger:#A3324A; --btn-ok-ink:#1F7A57;
  color-scheme:dark;
}
/* Modo claro: rosa médio vivo, menu framboesa e faixa pink — sem ficar pálido */
:root[data-theme="light"]{
  --bg:#F4C2D1; --surface:#FBE1E9; --ink:#3B0716; --muted:#7A3A50; --line:#E59AB2; --accent:#C2185B; --accent-ink:#FFFFFF; --soft:#F8D0DC;
  --rose:#FF8FB3;
  --side-bg:#A3174E; --side-ink:#FFF0F5; --side-muted:#FFD0DF; --side-hover:rgba(255,255,255,.12); --side-active:rgba(255,255,255,.2); --side-accent:#FFFFFF;
  --band-bg:linear-gradient(135deg,#E0457B 0%,#C2185B 55%,#A3174E 100%); --band-muted:#FFD6E3;
  --s1:#6E5560; --s2:#B0285A; --s3:#8F6315; --s4:#5B3FA0; --s5:#A0206A; --s6:#C2185B; --s7:#137A55; --grav:#5B3FA0; --tsk:#8F6315; --ok:#137A55; --warn:#B8401A;
  --shadow:0 1px 2px rgba(163,23,78,.12),0 6px 20px rgba(163,23,78,.14);
  --btn-bg:#FFE3EC; --btn-ink:#3B0716; --btn-line:#E59AB2; --btn-hover:#FFF0F5;
  --btn-primary:#E0457B; --btn-primary-ink:#FFFFFF; --btn-ghost-ink:#A3174E; --btn-danger:#B8401A; --btn-ok-ink:#137A55;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:0}
h1{font-style:italic}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .tab{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--btn-ink);border-radius:99px;padding:7px 12px;font-weight:600;font-size:14px;transition:background .15s,filter .15s}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-primary)}
.btn.primary{background:var(--btn-primary);border-color:var(--btn-primary);color:var(--btn-primary-ink);box-shadow:0 2px 10px color-mix(in srgb,var(--btn-primary) 35%,transparent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--btn-ghost-ink)}
.btn.ghost:hover{background:var(--soft)}
.side .btn.ghost{color:var(--side-ink)}
.side .btn.ghost:hover{background:var(--side-hover)}
.btn.danger{color:var(--btn-danger)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.theme-btn .t-light{display:none}
:root[data-theme="light"] .theme-btn .t-light{display:inline}
:root[data-theme="light"] .theme-btn .t-dark{display:none}
.theme-fab{position:fixed;top:14px;right:14px;z-index:40}
[hidden]{display:none!important}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* financeiro */
.fin-row{align-items:center}
.fin-check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:transparent;display:grid;place-items:center;font-weight:700;font-size:13px;padding:0}
.fin-check:hover{border-color:var(--ok);color:var(--ok)}
.fin-check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.fin-row.paid .money{opacity:.65}
.hbar{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:7px 14px;font-size:13px}
.hbar .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:8px;border-radius:99px;background:var(--soft);display:block}
.hbar .fill{display:block;height:100%;border-radius:99px;background:var(--fc)}
.fhist{width:100%;border-collapse:collapse;font-size:13.5px}
.fhist th{position:relative;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 14px}
.fhist td{padding:9px 14px;border-top:1px solid var(--line);white-space:nowrap}
.fhist td::first-letter{text-transform:uppercase}
.fhist .num{text-align:right}
.fhist tr.cur td{background:var(--soft);font-weight:700}
.fbars{display:flex;flex-direction:column;gap:3px;min-width:110px}
.fbars i{display:block;height:6px;border-radius:0 4px 4px 0;min-width:2px}
/* pagamentos do cliente */
.inv-list{display:grid;gap:10px;max-width:920px}
.inv{padding:14px 16px;display:grid;gap:10px;border-left:4px solid var(--line)}
.inv.soon{border-left-color:var(--s6)} .inv.late{border-left-color:var(--warn)}
.inv-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.inv-amt{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.pix{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inv-alert{border-color:var(--s6);background:color-mix(in srgb,var(--s6) 16%,var(--surface))}
.inv-alert.late{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
/* portal do cliente com menu lateral */
.welcome{font-family:var(--display);font-style:italic;font-weight:700;font-size:28px;line-height:1.1;color:var(--side-ink);padding:0 6px}
.cbrand{display:flex;align-items:center;gap:10px;padding:0 6px;min-width:0}
.cbrand .pavatar{width:42px;height:42px;border-radius:12px;font-size:17px}
.cbrand b{display:block;font-weight:700;line-height:1.25;color:var(--side-ink);overflow-wrap:anywhere}
.cbrand span{font-size:12px;color:var(--side-muted)}
.side .foot .row{gap:6px}
.pavatar{overflow:hidden}
.pavatar img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.logo-prev{display:flex;align-items:center;gap:10px}
.logo-prev .pavatar{width:44px;height:44px;border-radius:12px;font-size:17px}
.showpw{display:flex;align-items:center;gap:8px;margin-top:-6px;color:var(--muted);cursor:pointer;user-select:none;width:fit-content}
.showpw input{width:16px;height:16px;margin:0;accent-color:var(--btn-primary);cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%;overflow-x:clip}
.side{background:var(--side-bg);color:var(--side-ink);border-right:0;padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
/* logo Avélis: ícone do "A" recortado da arte */
.logo{width:40px;height:40px;border-radius:11px;background:#2B000C url(avelis-icone.png) center/cover no-repeat;flex:none;box-shadow:0 2px 10px rgba(43,0,12,.35)}
.logo.lg{width:64px;height:64px;border-radius:16px}
.brand b{font-family:var(--body);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;line-height:1.05;display:block;color:var(--side-ink)}
.brand span{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);margin-top:3px}
/* entrada: arte da Avélis em tela cheia + botão Entrar no canto superior direito */
.landing{background:#1d0009;color:#FBEFF2;min-height:100vh}
.landing-btn{position:fixed;top:18px;right:18px;z-index:30;padding:10px 26px;font-size:15px;box-shadow:0 4px 20px rgba(0,0,0,.35)}
.hero{position:relative;min-height:100vh;background:#1d0009 url(avelis-fundo.jpg) center/cover no-repeat}
.scroll-cue{all:unset;cursor:pointer;position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(251,239,242,.8)}
.scroll-cue span{font-size:22px;line-height:1;animation:cue 1.8s ease-in-out infinite}
.scroll-cue:hover{color:#fff}
.scroll-cue:focus-visible{outline:2px solid #F2A7BA;outline-offset:4px;border-radius:6px}
@keyframes cue{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (max-aspect-ratio:1/1){.hero{min-height:0;aspect-ratio:1672/941}.scroll-cue{display:none}}
.about{background:radial-gradient(ellipse at 50% 0%,#4A1426 0%,#2A0711 45%,#1d0009 100%);padding:clamp(56px,9vw,110px) 20px clamp(48px,7vw,80px);border-top:1px solid rgba(242,167,186,.18)}
.about-in{max-width:1080px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#F2A7BA}
.eyebrow::before{content:"";width:28px;height:2px;border-radius:2px;background:linear-gradient(90deg,#E0457B,#F2A7BA)}
.about-title{font-family:var(--body);font-style:normal;font-weight:700;font-size:clamp(24px,3.4vw,38px);line-height:1.2;letter-spacing:-.01em;margin:14px 0 20px;max-width:880px;color:#fff}
.about-lead{font-size:clamp(15px,1.5vw,17.5px);line-height:1.7;color:#E7C6CF;max-width:820px;margin:0 0 12px}
.about-lead b{color:#FF7FA8;font-weight:700}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:40px}
.feat{background:rgba(255,255,255,.035);border:1px solid rgba(242,167,186,.16);border-radius:14px;padding:20px;transition:border-color .2s,transform .2s}
.feat:hover{border-color:rgba(242,167,186,.45);transform:translateY(-2px)}
.feat-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#E0457B,#A3174E);box-shadow:0 6px 18px rgba(224,69,123,.3);margin-bottom:14px}
.feat h3{font-family:var(--body);font-size:15.5px;font-weight:700;color:#fff;margin:0 0 6px}
.feat p{margin:0;font-size:13.5px;line-height:1.55;color:#D4AAB5}
.about-cta{margin-top:44px;padding:26px 28px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,rgba(224,69,123,.22),rgba(163,23,78,.12));border:1px solid rgba(242,167,186,.25)}
.about-cta p{margin:0;font-size:clamp(17px,2vw,21px);font-weight:600;color:#fff}
.about-cta .btn{padding:11px 26px;font-size:15px}
.landing-foot{text-align:center;padding:22px 16px 28px;font-size:12px;letter-spacing:.06em;color:#9E7381;background:#1d0009}
/* formulário de login: fundo vinho, como antes */
.center.login-page{position:relative;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#4A1426 0%,#2A0711 60%,#1d0009 100%)}
.login-page .card{max-width:420px}
.login-back{position:absolute;top:14px;left:14px;color:#F7BFCD}
.login-back:hover{background:rgba(255,255,255,.08)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--side-muted);border-left:3px solid transparent}
.nav button:hover{background:var(--side-hover);color:var(--side-ink)}
.nav button[aria-current="true"]{background:var(--side-active);color:var(--side-accent);border-left-color:var(--rose)}
.nav button:focus-visible{outline:2px solid var(--rose)}
.side .count{background:var(--side-ink);color:var(--side-bg)}
.nav button[aria-current="true"]{border-left-color:var(--side-ink)}
.count{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-muted);padding:0 6px}
.main{padding:28px clamp(16px,3vw,36px) 60px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:2px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:14px}
select.sel,input.inp,textarea.inp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
select.sel{width:auto}
textarea.inp{min-height:84px;resize:vertical}
/* status */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-desenvolvimento{color:var(--s1)} .st-analise{color:var(--s2)} .st-producao{color:var(--s3)} .st-produzido{color:var(--s4)} .st-edicao{color:var(--s5)} .st-aprovacao{color:var(--s6)} .st-postagem{color:var(--s7)} .st-ok{color:var(--ok)} .st-warn{color:var(--warn)}
.cdot{width:10px;height:10px;border-radius:3px;background:var(--cc,#999);flex:none;display:inline-block}
/* overview */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:22px}
.stat{padding:14px 16px;border-top:3px solid var(--sc)}
.stat .n{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--cc)}
.ccard .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.li:first-child{border-top:0}
.li.click{cursor:pointer} .li.click:hover{background:var(--soft)}
.date-badge{flex:none;width:46px;text-align:center;border-radius:8px;background:var(--bg);padding:4px 0;line-height:1.15}
.date-badge b{display:block;font-family:var(--display);font-size:18px}
.date-badge span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.type.post{color:var(--accent)} .type.grav{color:var(--grav)} .type.task{color:var(--tsk)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:420px;border-top:3px solid var(--sc)}
.col.over{outline:2px dashed var(--sc);outline-offset:-4px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 8px}
.col-h b{font-family:var(--display);font-size:15px}
.col-b{display:flex;flex-direction:column;gap:8px;padding:4px 10px 12px;flex:1}
.kcard{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:8px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--muted);border-left-color:var(--cc)}
.kcard.dragging{opacity:.4}
.kc-top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.kc-top .fmt{margin-left:auto;font-weight:600;background:var(--surface);border:1px solid var(--line);padding:0 6px;border-radius:5px}
.kc-title{font-weight:700;line-height:1.3}
.kc-meta{display:flex;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.add-in-col{all:unset;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;padding:6px 4px;border-radius:6px;text-align:center}
.add-in-col:hover{color:var(--accent);background:var(--soft)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 8px}
/* calendar */
.calwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;align-items:start}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.calbar h2::first-letter,.dayhead h3::first-letter,.agday .d::first-letter{text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:8px;letter-spacing:.04em}
.day{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;background:var(--surface)}
.day:nth-child(7n+1){border-left:0}
.day:hover{background:var(--soft)}
.day.out{background:var(--bg)} .day.out .dn{opacity:.45}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .dn{background:var(--accent);color:var(--accent-ink)}
.pill{font-size:11px;font-weight:600;line-height:1.25;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--cc,transparent)}
.pill.post{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink)}
.pill.grav{background:color-mix(in srgb,var(--grav) 16%,transparent);color:var(--ink)}
.pill.task{background:color-mix(in srgb,var(--tsk) 18%,transparent);color:var(--ink)}
.pill.done{text-decoration:line-through;opacity:.6}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.dayhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.item{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700}
.todo{margin-top:6px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px}
.todo b{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--grav)}
.chk{width:20px;height:20px;accent-color:var(--ok);margin-top:2px;flex:none}
.agenda{margin-top:18px}
.agday{display:grid;grid-template-columns:120px 1fr;border-top:1px solid var(--line)}
.agday:first-child{border-top:0}
.agday .d{padding:12px 16px;font-weight:700;font-size:14px;}
.agday .d span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.agday .items .item:first-child{border-top:0}
.agday .items{border-left:1px solid var(--line)}
/* client portal */
.portal{max-width:1180px;margin:0 auto;padding:24px clamp(16px,3vw,32px) 60px}
.phead{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;background:var(--band-bg);color:var(--side-ink);padding:22px 24px;border-radius:16px;position:relative;overflow:hidden}
.phead::after{content:"";position:absolute;right:-80px;top:-120px;width:300px;height:300px;border:1.5px solid var(--rose);border-radius:50%;opacity:.45}
.phead .muted{color:var(--band-muted)}
.phead h1{font-size:30px}
.pavatar{box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.pavatar{width:52px;height:52px;border-radius:14px;background:var(--cc);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:22px;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.steps{display:flex;gap:4px;margin-top:8px}
.steps span{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps span.on{background:var(--sc)}
.approve{display:flex;flex-direction:column;gap:12px;padding:16px;border-left:4px solid var(--s6)}
.caption{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
/* modal */
#modal .back{position:fixed;inset:0;background:rgba(10,8,16,.45);display:grid;place-items:center;padding:16px;z-index:50}
#modal .dlg{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-b{padding:18px 20px;display:grid;gap:14px}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
label.fl .hint{font-weight:400;color:var(--muted);font-size:12px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches input{appearance:none;width:26px;height:26px;border-radius:7px;background:var(--sw);cursor:pointer;margin:0;border:2px solid transparent}
.swatches input:checked{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.center{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.center .card{max-width:460px;padding:28px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);padding:6px 10px;border-radius:6px;word-break:break-all;display:inline-block}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.period{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.period .lbl{font-family:var(--display);font-weight:700;font-size:16px;min-width:150px;text-align:center}
.period .lbl::first-letter{text-transform:uppercase}
.cal.week .day{min-height:220px}
.cal.week .pill{white-space:normal;overflow:visible}
.btn.done-btn{border-color:var(--ok);color:var(--btn-ok-ink)}
.btn.done-btn.armed{background:var(--ok);color:#fff}
.stepinfo{font-size:12px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip.client{color:var(--ok);border-style:dashed}
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mitem{position:relative;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);aspect-ratio:4/5;display:grid;place-items:center}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.mitem img{cursor:zoom-in;background:var(--bg)}
.mitem .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;display:grid;place-items:center}
.mitem .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;pointer-events:none}
.mitem.broken img,.mitem.broken video{display:none}
.mitem.broken::after{content:"Não foi possível carregar este arquivo";font-size:12px;color:var(--muted);padding:10px;text-align:center}
.mitem.loading::after{content:"Enviando…";font-size:12px;color:var(--muted)}
.media-box{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.media-big{max-width:100%;max-height:70vh;border-radius:8px;display:block;margin:0 auto}
.cards.one{grid-template-columns:1fr;max-width:920px}
.media-grid.lg{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.crm-stats .stat .n{font-size:24px}
.kanban.crm{grid-template-columns:repeat(7,minmax(200px,1fr))}
.fu-group{padding:8px 14px 4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-top:1px solid var(--line);color:var(--muted)}
.fu-group:first-child{border-top:0}
.fu-group.late{color:var(--warn)} .fu-group.today{color:var(--accent)}
.late-txt{color:var(--warn);font-weight:700}
.today-txt{color:var(--accent);font-weight:700}
.hist{display:flex;flex-direction:column;gap:8px}
.hist .h{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px}
.hist .h b{font-size:12px;color:var(--muted);display:block}
.search{width:240px;max-width:100%}
a.btn{text-decoration:none;color:var(--btn-ink)}
a.btn.ghost{color:var(--btn-ghost-ink)}
a.btn.primary{color:var(--btn-primary-ink)}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.perms{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.perm{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;background:var(--bg);cursor:pointer}
.perm:hover{background:var(--soft)}
.perm input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.perm b{display:block;font-size:14px}
.perm span{font-size:12.5px;color:var(--muted)}
.locked{padding:30px;text-align:center}
.pwrules{list-style:none;margin:-4px 0 0;padding:0;display:grid;gap:3px;color:var(--muted)}
.pwrules li::before{content:"○ ";color:var(--muted)}
.pwrules li.ok{color:var(--ok)} .pwrules li.ok::before{content:"✓ ";color:var(--ok)}
.pwbox{display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px}
.pwbox .code{font-size:18px;letter-spacing:.06em}
.msgbox{white-space:pre-wrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){
  .grid2,.calwrap{grid-template-columns:1fr}
}
/* menu sanduíche: barra no topo + menu lateral deslizante (só em telas pequenas) */
.mbar,.side-scrim{display:none}
.hamb{all:unset;cursor:pointer;position:relative;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--side-ink)}
.hamb:hover{background:var(--side-hover)}
.hamb:focus-visible{outline:2px solid var(--side-ink);outline-offset:2px}
.hamb i{position:absolute;left:11px;width:20px;height:2px;border-radius:2px;background:currentColor;transition:transform .22s,opacity .22s}
.hamb i:nth-child(1){top:14px} .hamb i:nth-child(2){top:20px} .hamb i:nth-child(3){top:26px}
.menu-open .hamb i:nth-child(1){transform:translateY(6px) rotate(45deg)}
.menu-open .hamb i:nth-child(2){opacity:0}
.menu-open .hamb i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.hamb .dot{position:absolute;top:7px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--side-ink);color:var(--side-bg);font-size:10px;font-weight:700;display:grid;place-items:center;font-style:normal}
.menu-open .hamb .dot{display:none}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:35;background:var(--side-bg);color:var(--side-ink);padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
  .mbar .mtitle{flex:1;min-width:0;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbar .logo{width:32px;height:32px;border-radius:9px}
  .side{position:fixed;top:0;left:0;bottom:0;z-index:45;width:min(84vw,300px);height:100%;overflow-y:auto;transform:translateX(-105%);transition:transform .25s ease,visibility 0s linear .25s;box-shadow:none;visibility:hidden}
  .menu-open .side{transform:none;visibility:visible;transition:transform .25s ease;box-shadow:8px 0 40px rgba(0,0,0,.4)}
  .menu-open .side-scrim{display:block;position:fixed;inset:0;z-index:40;background:rgba(15,0,5,.55)}
  .side.client .welcome{font-size:24px}
  .day{min-height:64px}
  .pill{font-size:0;height:6px;padding:0;border-left:0}
  .agday{grid-template-columns:1fr}
  .agday .items{border-left:0}
  .f2{grid-template-columns:1fr}
}
</style>
<script src="theme.js"></script>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="theme-fab" class="theme-fab"><button type="button" class="btn theme-btn" data-act="theme" aria-label="Alternar modo claro ou escuro"><span class="t-dark">☀ Modo claro</span><span class="t-light">☾ Modo escuro</span></button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
